plugins { id 'com.android.application' }

android {
    namespace 'uk.org.fancy.nxapi.mobile'
    compileSdk 35
    ndkVersion '27.0.12077973'
    buildFeatures { buildConfig true; prefab true }

    defaultConfig {
        applicationId 'uk.org.fancy.nxapi.mobile'
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName 'current-mobile.21-release-review'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets { main { jniLibs.srcDirs 'libnode/bin' } }
    dependencies { implementation files('libs/discord_partner_sdk.aar') }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
}

tasks.register('verifyEmbeddedNodeProject') {
    doLast {
        def archive = file('src/main/assets/node-project.zip')
        if (!archive.exists()) throw new GradleException('node-project.zip is missing')
        def product = zipTree(archive).matching { include 'dist/util/product.js' }.singleFile.text
        if (!product.contains('NXAPI_DATA_PATH')) throw new GradleException('Embedded product.js is stale')
        def names = zipTree(archive).files.collect { it.path.replace('\\', '/') }
        if (!names.any { it.endsWith('/resources/common/remote-config.json') }) throw new GradleException('remote-config.json is missing')
    }
}
preBuild.dependsOn verifyEmbeddedNodeProject
