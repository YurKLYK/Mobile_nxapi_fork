<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e60012">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/app.css">
  <title>nxapi Mobile</title>
</head>
<body>
  <header><img src="/assets/icon.svg" alt=""><div><b>nxapi Mobile</b><small id="status">接続中…</small></div><button id="refresh" class="ghost" aria-label="更新">↻</button></header>
  <main>
    <section id="login" class="card hidden">
      <h1>Nintendoアカウントを追加</h1><p>ログイン後、「この人にする」を長押ししてリンクをコピーし、下に貼り付けます。</p>
      <button id="startLogin">Nintendoでログイン</button><label>コピーしたリンク<input id="redirectUrl" placeholder="npf71b…://auth#…"></label><button id="completeLogin">連携を完了</button>
      <p class="notice">認証情報はこのnxapiサーバー内にだけ保存されます。第三者APIへの送信が必要な場合があります。</p>
    </section>
    <section id="app" class="hidden">
      <button id="discordConnect" class="ghost">Discord連携</button>
      <label>Discordに表示するユーザー<select id="presenceTarget"><option value="">ログイン中の自分（通常表示のみ）</option></select></label>
      <small class="notice">詳しいSplatNet 3状態には、メインアカウントとフレンドのサブアカウントでログインし、ここでメインを選択します。</small>
      <article class="profile card"><img id="avatar" alt=""><div><h1 id="name"></h1><p id="screenName"></p></div></article>
      <nav><button data-tab="friends" class="active">フレンド</button><button data-tab="services">サービス</button><button data-tab="news">お知らせ</button></nav>
      <section id="content" class="list"></section><button id="logout" class="danger ghost">アカウントを解除</button>
    </section>
    <div id="error" class="toast hidden"></div>
  </main>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
